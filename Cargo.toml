[workspace]
resolver = "3"
members = ["crates/vergence-edid", "crates/vergence-profile", "crates/vergence-xsettings", "crates/vergence-harness", "crates/vergence-server", "crates/vergence-settings", "crates/vergence-protocol", "crates/vergence-dbus", "crates/vergence-term", "crates/vergence-scene", "crates/vergence-text", "crates/vergence-render", "crates/vergence-wl", "crates/vergence-ui", "crates/vergence-look", "crates/vergence-shell", "crates/vergence-widgets", "crates/vergence-sound", "crates/vergence-seat", "crates/vergence-bar", "crates/vergence-net", "crates/vergence-power", "crates/vergence-calc", "crates/vergence-quit", "crates/vergence-sysinfo", "crates/vergence-hw", "crates/vergence-edit", "crates/vergence-spell", "crates/vergence-types", "crates/vergence-decode", "crates/vergence-closeup", "crates/vergence-reader", "crates/vergence-files", "crates/vergence-thumbs", "crates/vergence-media", "crates/vergence-dm", "crates/vergence-pdf", "crates/vergence-raster", "crates/vergence-hymie", "crates/vergence-hymie-aac", "crates/vergence-config", "crates/vergence-archive"]

[workspace.package]
