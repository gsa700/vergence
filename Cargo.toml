[workspace]
resolver = "3"
members = ["crates/vergence-edid", "crates/vergence-profile", "crates/vergence-xsettings", "crates/vergence-harness", "crates/vergence-server", "crates/vergence-settings", "crates/vergence-protocol", "crates/vergence-dbus", "crates/vergence-term", "crates/vergence-scene", "crates/vergence-text", "crates/vergence-render", "crates/vergence-wl", "crates/vergence-ui", "crates/vergence-look", "crates/vergence-shell", "crates/vergence-widgets", "crates/vergence-sound", "crates/vergence-seat", "crates/vergence-bar", "crates/vergence-net", "crates/vergence-power", "crates/vergence-calc", "crates/vergence-quit", "crates/vergence-sysinfo", "crates/vergence-hw"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "Apache-2.0 OR GPL-2.0-or-later"
publish = false

[workspace.dependencies]
vergence-edid = { path = "crates/vergence-edid" }
vergence-profile = { path = "crates/vergence-profile" }
vergence-xsettings = { path = "crates/vergence-xsettings" }
vergence-protocol = { path = "crates/vergence-protocol" }
vergence-sound = { path = "crates/vergence-sound" }
vergence-dbus = { path = "crates/vergence-dbus" }
vergence-scene = { path = "crates/vergence-scene" }
vergence-text = { path = "crates/vergence-text" }
vergence-render = { path = "crates/vergence-render" }
vergence-wl = { path = "crates/vergence-wl" }
vergence-ui = { path = "crates/vergence-ui" }
vergence-look = { path = "crates/vergence-look" }
vergence-shell = { path = "crates/vergence-shell" }
vergence-widgets = { path = "crates/vergence-widgets" }
vergence-seat = { path = "crates/vergence-seat" }
vergence-bar = { path = "crates/vergence-bar" }
vergence-net = { path = "crates/vergence-net" }
vergence-power = { path = "crates/vergence-power" }
vergence-calc = { path = "crates/vergence-calc" }
vergence-sysinfo = { path = "crates/vergence-sysinfo" }

# drm-rs 0.14.1 with the FreeBSD DRM node fixes (patches/README.md).
[patch.crates-io]
drm = { path = "third_party/drm-rs" }
