[workspace]
resolver = "3"
members = ["crates/vergence-edid", "crates/vergence-profile", "crates/vergence-xsettings", "crates/vergd", "crates/vergence-harness", "crates/vergence-server"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
publish = false

[workspace.dependencies]
vergence-edid = { path = "crates/vergence-edid" }
vergence-profile = { path = "crates/vergence-profile" }
vergence-xsettings = { path = "crates/vergence-xsettings" }

# drm-rs 0.14.1 with the FreeBSD DRM node fixes (patches/README.md).
[patch.crates-io]
drm = { path = "third_party/drm-rs" }
