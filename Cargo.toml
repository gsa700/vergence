[workspace]
resolver = "3"
members = ["crates/vergence-edid", "crates/vergence-profile", "crates/vergence-xsettings", "crates/vergd", "crates/vergence-harness", "crates/vergence-server", "crates/vergence-settings", "crates/vergence-protocol", "crates/vergence-dbus", "crates/vergence-term", "crates/vergence-scene", "crates/vergence-text"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
publish = false

[workspace.dependencies]
vergence-edid = { path = "crates/vergence-edid" }
vergence-profile = { path = "crates/vergence-profile" }
vergence-xsettings = { path = "crates/vergence-xsettings" }
vergence-protocol = { path = "crates/vergence-protocol" }
vergence-dbus = { path = "crates/vergence-dbus" }
vergence-scene = { path = "crates/vergence-scene" }
vergence-text = { path = "crates/vergence-text" }

# drm-rs 0.14.1 with the FreeBSD DRM node fixes (patches/README.md).
[patch.crates-io]
drm = { path = "third_party/drm-rs" }
# iced_tiny_skia 0.14.1 without the clip mask rebuilt for every text (patches/README.md).
iced_tiny_skia = { path = "third_party/iced_tiny_skia" }
