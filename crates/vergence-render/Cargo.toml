[package]
name = "vergence-render"
description = "Vergence's renderer: a scene into pixels, on the CPU (the reference) and the GPU (whitepaper §6.10)"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
