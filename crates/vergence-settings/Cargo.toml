[package]
name = "vergence-settings"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "Vergence's settings app: appearance, theme and fonts, windows, screens and wallpaper"

# iced (MIT; the tools' toolkit since 2026-11-08, Dave's choice after the
# toolkit spike, spikes/toolkit/RESULTS.md). Ported from Slint the same day.
[dependencies]
iced = { version = "0.14", features = ["image", "canvas", "advanced"] }
toml = "0.8"
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
resvg = "0.45"
vergence-protocol.workspace = true
vergence-profile.workspace = true
vergence-xsettings.workspace = true
