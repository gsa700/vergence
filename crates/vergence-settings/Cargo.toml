[package]
name = "vergence-settings"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "Vergence's settings app (prototype): wallpaper and common desktop settings"

# Slint (whitepaper §8: the tools' toolkit; open question 8, Slint or iced, is
