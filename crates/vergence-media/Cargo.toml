[package]
name = "vergence-media"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "Removable drives: mounted when plugged in and ejected, by udisks2 on Linux and the automounter on FreeBSD"

[dependencies]
# The drive list's types (drives.rs), as the server puts it on the bus.
vergence-protocol.workspace = true

# udisks2 is reached over D-Bus on Linux only.
[target.'cfg(target_os = "linux")'.dependencies]
vergence-dbus.workspace = true
