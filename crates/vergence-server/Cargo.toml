[package]
name = "vergence-server"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "Vergence's Wayland server (phase 2): one authority over the screens and the input"

# Started from Smithay's smallvil example (MIT, LICENSE-smithay.txt), 2026-11-07.
# Smithay is pinned to the commit that built and ran on Hubble (FreeBSD 15.1) in step 0.

[dependencies]
tracing = "0.1"
tracing-subscriber = { version = "0.3.16", features = ["env-filter"] }
bitflags = "2.2.1"
xcursor = "0.3"
# xkbcommon used directly (seat milestone 1, step 3; Dave 2026-11-12): the same
# library and version Smithay builds on, for our own xkb state (keys.rs).
xkbcommon = { version = "0.9", default-features = false }
vergence-profile.workspace = true
vergence-look.workspace = true
vergence-shell.workspace = true
vergence-seat.workspace = true
vergence-bar.workspace = true
vergence-scene.workspace = true
vergence-text.workspace = true
vergence-render.workspace = true
vergence-edid.workspace = true
vergence-xsettings.workspace = true
vergence-protocol.workspace = true
vergence-sound.workspace = true
vergence-dbus.workspace = true
x11rb = "0.13"
png = "0.18"
ab_glyph = "0.2"
serde = { version = "1", features = ["derive"] }
toml = "0.8"
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
resvg = "0.45"

[dependencies.smithay]
git = "https://github.com/Smithay/smithay"
rev = "65aa86f"
default-features = false
features = ["backend_winit", "wayland_frontend", "desktop", "backend_drm", "backend_gbm", "backend_egl", "backend_libinput", "backend_udev", "backend_session_libseat", "renderer_gl", "use_system_lib", "xwayland", "x11rb_event_source"]

# The connector scan; without libdisplay-info (FreeBSD has 0.4, its binding wants < 0.4;
# vergence-edid reads the EDIDs).
[dependencies.smithay-drm-extras]
git = "https://github.com/Smithay/smithay"
rev = "65aa86f"
default-features = false

