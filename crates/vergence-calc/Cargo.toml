[package]
name = "vergence-calc"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "Vergence's calculator: exact decimal arithmetic of its own, a keypad, a scientific mode, on vergence-ui"

# The calculator is the project's own throughout: its numbers (dec.rs, exact
# decimals to 34 digits), its reading of what is typed (expr.rs), and its
# window, on the toolkit (tools milestone 1).
[dependencies]
vergence-config.workspace = true
vergence-ui.workspace = true
vergence-widgets.workspace = true
vergence-scene.workspace = true
vergence-text.workspace = true
vergence-look.workspace = true

[lib]
path = "src/lib.rs"

[[bin]]
name = "vergence-calc"
path = "src/main.rs"
