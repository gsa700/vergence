[package]
name = "vergence-term"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "Vergence's terminal: tabs in the window's bar, split panes, sharp at every scale, on vergence-ui, the project's own toolkit"

# The terminal is the project's own throughout: parser, screen and pty
# (vt.rs, grid.rs, pty.rs), and since 2026-11-10 its interface, on the
# toolkit (vergence-ui and the crates under it). Its first interface was
# built on iced (2026-11-08) and was retired when this one passed the
# stress test (docs/toolkit-milestone-1.md, step 5).
[dependencies]
vergence-scene.workspace = true
vergence-text.workspace = true
vergence-render.workspace = true
vergence-ui.workspace = true
vergence-widgets.workspace = true
vergence-look.workspace = true
# grid.rs decodes OSC 52 clipboard writes with this. It came into the
# workspace with iced, which is gone (2026-11-10): now borrowed by the
# terminal alone. To be replaced by a few lines of our own.
base64 = "0.22"
